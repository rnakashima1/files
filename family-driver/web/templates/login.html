{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h2>🚦 Hit the road</h2>
<p class="muted">Buckle up and sign in.</p>
<form method="post" action="{{ url_for('login') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Email
    <input type="email" name="email" value="{{ email }}" required autofocus>
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>
  <button type="submit">Hit the road</button>
</form>
<p class="muted">
  <a href="{{ url_for('forgot') }}">Lost your keys?</a>
  &nbsp;·&nbsp;
  New here? <a href="{{ url_for('signup') }}">Get your keys</a>
</p>
{% endblock %}
