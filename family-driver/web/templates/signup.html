{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<h2>✨ Create your family's account</h2>
<p class="muted">Verify your email next, then a few quick questions and the carpool fairy takes over.</p>
<form method="post" action="{{ url_for('signup') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Email
    <input type="email" name="email" value="{{ email }}" required autofocus>
  </label>
  <label>Password <span class="muted">(at least 8 characters)</span>
    <input type="password" name="password" minlength="8" required>
  </label>
  <label>Confirm password
    <input type="password" name="confirm" minlength="8" required>
  </label>
  <button type="submit" class="primary">✨ Create account</button>
</form>
<p class="muted" style="text-align:center;margin-top:14px">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
