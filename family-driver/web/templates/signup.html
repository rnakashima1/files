{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<h2>🔑 Get your keys</h2>
<p class="muted">Register your driver's license — verify your email next, then map your household.</p>
<form method="post" action="{{ url_for('signup') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Email
    <input type="email" name="email" value="{{ email }}" required autofocus>
  </label>
  <label>Password <span class="muted">(at least 8 characters)</span>
    <input type="password" name="password" minlength="8" required>
  </label>
  <label>Confirm password
    <input type="password" name="confirm" minlength="8" required>
  </label>
  <button type="submit">Get your keys</button>
</form>
<p class="muted">Already have keys? <a href="{{ url_for('login') }}">Hit the road</a></p>
{% endblock %}
