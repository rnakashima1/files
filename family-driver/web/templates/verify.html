{% extends "base.html" %}
{% block title %}Verify email{% endblock %}
{% block content %}
<h2>🛂 Check your mirrors</h2>
<p class="muted">Enter the 6-digit code we emailed to <strong>{{ email }}</strong>.</p>
<form method="post" action="{{ url_for('verify') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="email" value="{{ email }}">
  <label>Verification code
    <input type="text" name="code" inputmode="numeric" pattern="[0-9]*"
           maxlength="6" autocomplete="one-time-code" required autofocus>
  </label>
  <button type="submit">Verify</button>
</form>
<form method="post" action="{{ url_for('resend_code') }}" class="inline-form">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="email" value="{{ email }}">
  <button type="submit" class="link-button">Resend code</button>
</form>
{% endblock %}
